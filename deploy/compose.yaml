# SQL Server must run on supported external x64 hardware; no SQL engine on DS223j.
services:
  logistica:
    image: deniscorp/logistica:0.2.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 256m
    env_file: .env.private
    environment:
      DataProtection__KeysPath: /keys
      Hosting__PathBase: /deniscorp/logistica-transporte
    ports: ['127.0.0.1:4190:8080']
    volumes: ['./keys:/keys']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    healthcheck:
      test: ['CMD','dotnet','Logistica_y_transporte.dll','--comprobar-db']
      interval: 60s
      timeout: 15s
      retries: 3
